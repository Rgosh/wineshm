<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Owned and mirrored: which mode a block gets, and why</title>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7a90"/>
    </marker>
    <style>
      .bg    { fill: #ffffff; }
      .panel { fill: #f4f6f9; stroke: #d6dce6; stroke-width: 1.5; rx: 10; }
      .good  { fill: #eefaf2; stroke: #3f9d6b; stroke-width: 2; rx: 10; }
      .work  { fill: #fff6ec; stroke: #d98a3a; stroke-width: 2; rx: 10; }
      .box   { fill: #ffffff; stroke: #9aa8bd; stroke-width: 1.5; rx: 8; }
      .h     { fill: #20293a; font-size: 16px; font-weight: 600; }
      .t     { fill: #20293a; font-size: 14px; }
      .small { fill: #5b6878; font-size: 12px; }
      .line  { stroke: #6b7a90; stroke-width: 1.8; fill: none; marker-end: url(#a2); }
      @media (prefers-color-scheme: dark) {
        .bg    { fill: #0f1319; }
        .panel { fill: #161c26; stroke: #2a3444; }
        .good  { fill: #12241a; stroke: #4fbe84; }
        .work  { fill: #2a1e10; stroke: #e2a35c; }
        .box   { fill: #1b222e; stroke: #46536a; }
        .h     { fill: #e6ecf5; }
        .t     { fill: #e6ecf5; }
        .small { fill: #a3b0c2; }
        .line  { stroke: #8695ab; }
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="860" height="340"/>

  <text class="h" x="30" y="32">Which mode a block gets is not a setting — it is who got there first</text>

  <!-- OWNED -->
  <rect class="good" x="30" y="52" width="386" height="248"/>
  <text class="h" x="52" y="82">owned</text>
  <text class="small" x="52" y="102">wineshm started before the writer</text>

  <rect class="box" x="52" y="120" width="150" height="46"/>
  <text class="t" x="68" y="148">wineshm</text>
  <rect class="box" x="244" y="120" width="150" height="46"/>
  <text class="t" x="260" y="148">the writer</text>

  <path class="line" d="M 127 166 L 127 206"/>
  <path class="line" d="M 319 166 L 319 206"/>
  <text class="small" x="62" y="192">creates the section</text>
  <text class="small" x="254" y="192">opens it, writes</text>

  <rect class="box" x="52" y="210" width="342" height="42"/>
  <text class="t" x="68" y="237">/dev/shm file — the section itself</text>

  <text class="t" x="52" y="278">Cost: nothing, ever. Latency: none.</text>

  <!-- MIRRORED -->
  <rect class="work" x="444" y="52" width="386" height="248"/>
  <text class="h" x="466" y="82">mirrored</text>
  <text class="small" x="466" y="102">the writer was already running</text>

  <rect class="box" x="466" y="120" width="150" height="46"/>
  <text class="t" x="482" y="148">the writer</text>
  <rect class="box" x="658" y="120" width="150" height="46"/>
  <text class="t" x="674" y="148">wineshm</text>

  <path class="line" d="M 541 166 L 541 206"/>
  <path class="line" d="M 616 143 L 652 143"/>
  <text class="small" x="476" y="192">owns the section</text>

  <rect class="box" x="466" y="210" width="150" height="42"/>
  <text class="small" x="480" y="236">its own section</text>
  <rect class="box" x="658" y="210" width="150" height="42"/>
  <text class="small" x="672" y="236">/dev/shm file</text>

  <path class="line" d="M 616 231 L 652 231"/>
  <text class="small" x="612" y="200">copies</text>

  <text class="t" x="466" y="278">Cost: one memcmp per look, one memcpy per change.</text>
</svg>
